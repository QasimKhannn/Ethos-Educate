version: '3.8'


services:
 vectordb:
   image: pgvector/pgvector:0.8.0-pg15-trixie
   environment:
     POSTGRES_DB: mydatabase
     POSTGRES_USER: myuser
     POSTGRES_PASSWORD: mypassword
   volumes:
     - pgdata2:/var/lib/postgresql/data
   ports:
     - "5433:5432"


 rag_api:
   build:
     context: ./rag-api
     dockerfile: Dockerfile
   environment:
     - DB_HOST=vectordb
     - DB_PORT=5432
     - POSTGRES_DB=mydatabase
     - POSTGRES_USER=myuser
     - POSTGRES_PASSWORD=mypassword
     # No OPENAI_API_KEY needed - using free HuggingFace embeddings!
   ports:
     - "${RAG_PORT:-8000}:8000"
   volumes:
     - ./rag-api/uploads:/app/uploads
     # Optional: Mount code for development (comment out for production)
     # - ./rag-api/app:/app/app
     # - ./rag-api/main.py:/app/main.py
   depends_on:
     - vectordb
   env_file:
     - .env


volumes:
 pgdata2:



